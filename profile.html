<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ticket - CosNite Club</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; padding: 20px; text-align: center; }
        .container { max-width: 700px; margin: auto; background: #2a2a2a; padding: 30px; border-radius: 10px; }
        input, button, select, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 5px; border: none; box-sizing: border-box; }
        button { background-color: #facc15; color: black; font-weight: bold; cursor: pointer; }
        .ticket-box { background: #333; padding: 20px; border-radius: 10px; margin-top: 20px; text-align: left; border: 1px solid #444; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; padding: 10px; background: white; width: max-content; border-radius: 5px; }
        .status-paid { color: #4ade80; font-weight: bold; }
        .status-pending { color: #facc15; font-weight: bold; }
        .member-block { background: #444; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .member-input { background: #222; color: white; border: 1px solid #555; }
        .logout-btn { background-color: #ef4444; color: white; margin-top: 20px; }
        .google-btn { background-color: #ffffff; color: #444; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #ddd; }
        .locked-msg { color: #f87171; font-size: 14px; margin-top: -10px; margin-bottom: 15px; display: block; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบสมาชิก CosNite Club</h2>

        <div id="authSection">
            <p>เข้าสู่ระบบเพื่อดูตั๋วของคุณ</p>
            <button id="loginBtn" class="google-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" width="20">
                เข้าสู่ระบบด้วย Google
            </button>
        </div>

        <div id="profileSection" style="display: none;">
            <p>ยินดีต้อนรับ, <span id="displayEmail" style="color: #facc15;"></span></p>
            <div id="ticketContainer"></div>
            <button id="logoutBtn" class="logout-btn">ออกจากระบบ</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVvOAwIpu6PPcQumrmqN0Sdc9yT-69kRE",
            authDomain: "cosniteclub.firebaseapp.com",
            projectId: "cosniteclub",
            storageBucket: "cosniteclub.firebasestorage.app",
            messagingSenderId: "429033863377",
            appId: "1:429033863377:web:e1077d4f5ebf29e3e8adf0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // รายชื่อ Guest สามารถมาแก้ตรงนี้ได้เลย
        const guestList = ["เกสต์ A", "เกสต์ B", "เกสต์ C", "เกสต์ D", "เกสต์ E", "เกสต์ F"];

        const authSection = document.getElementById('authSection');
        const profileSection = document.getElementById('profileSection');
        const displayEmail = document.getElementById('displayEmail');
        const ticketContainer = document.getElementById('ticketContainer');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authSection.style.display = 'none';
                profileSection.style.display = 'block';
                displayEmail.innerText = user.email;
                loadMyTickets(user.uid);
            } else {
                authSection.style.display = 'block';
                profileSection.style.display = 'none';
                ticketContainer.innerHTML = '';
            }
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => console.error(error));
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        async function loadMyTickets(uid) {
            ticketContainer.innerHTML = '<p>กำลังค้นหาตั๋ว...</p>';
            try {
                const q = query(collection(db, "Tickets"), where("userId", "==", uid));
                const qs = await getDocs(q);
                
                if (qs.empty) {
                    ticketContainer.innerHTML = '<p>คุณยังไม่มีตั๋วที่ทำการจองไว้</p>';
                    return;
                }

                ticketContainer.innerHTML = '';
                qs.forEach((d) => {
                    const data = d.data();
                    const ticketId = d.id;
                    const isPaid = data.status === 'paid';
                    const isLocked = data.isMembersLocked === true;
                    const statusText = isPaid ? 'ยืนยันการชำระเงินแล้ว' : 'รอแอดมินตรวจสอบสลิป';
                    const statusClass = isPaid ? 'status-paid' : 'status-pending';

                    const isVip = data.type.includes('vip');
                    const isParty = data.type.includes('party');

                    let memberCount = 1;
                    if(data.type.includes('4')) memberCount = 4;
                    if(data.type.includes('6')) memberCount = 6;

                    let membersHtml = ``;
                    
                    if (isLocked) {
                        membersHtml += `<span class="locked-msg">** ข้อมูลถูกบันทึกแล้ว หากต้องการแก้ไขข้อมูล กรุณาติดต่อเพจเฟซบุ๊ก **</span>`;
                        if (isParty || isVip) {
                            membersHtml += `<p><strong>รีเควสเพิ่มเติม:</strong> ${data.request || '-'}</p>`;
                        }
                    } else {
                        if (isParty || isVip) {
                            membersHtml += `
                                <strong>รีเควสเพิ่มเติม (โซนที่นั่ง หรือ อื่นๆ):</strong>
                                <textarea id="request_${ticketId}" class="member-input" rows="2" placeholder="ระบุความต้องการของคุณ (ถ้ามี)">${data.request || ''}</textarea>
                            `;
                        }
                    }

                    membersHtml += `<h4 style="margin-bottom: 5px;">รายชื่อผู้เข้าร่วม:</h4>`;

                    for(let i = 0; i < memberCount; i++) {
                        let member = data.members && data.members[i] ? data.members[i] : {name: '', dob: '', facebook: '', guest: ''};
                        
                        membersHtml += `<div class="member-block"><strong>คนที่ ${i+1}</strong><br>`;
                        
                        if (isLocked) {
                            membersHtml += `
                                <p style="margin: 5px 0;">ชื่อ-สกุล: ${member.name || '-'}</p>
                                <p style="margin: 5px 0;">วันเกิด: ${member.dob || '-'}</p>
                                <p style="margin: 5px 0;">Facebook: ${member.facebook || '-'}</p>
                                ${isVip ? `<p style="margin: 5px 0; color: #facc15;">Guest (2-shot): ${member.guest || '-'}</p>` : ''}
                            `;
                        } else {
                            membersHtml += `
                                <input type="text" id="m_name_${ticketId}_${i}" class="member-input" placeholder="ชื่อ-นามสกุล" value="${member.name || ''}">
                                <input type="text" id="m_dob_${ticketId}_${i}" class="member-input" placeholder="วัน/เดือน/ปีเกิด" value="${member.dob || ''}">
                                <input type="text" id="m_fb_${ticketId}_${i}" class="member-input" placeholder="ลิงก์หรือชื่อ Facebook" value="${member.facebook || ''}">
                            `;
                            
                            // ดรอปดาวน์เลือกเกสต์สำหรับ VIP
                            if (isVip) {
                                let guestOptions = `<option value="">-- เลือก Guest 2-shot --</option>`;
                                guestList.forEach(g => {
                                    guestOptions += `<option value="${g}" ${member.guest === g ? 'selected' : ''}>${g}</option>`;
                                });
                                membersHtml += `<select id="m_guest_${ticketId}_${i}" class="member-input" style="border: 1px solid #facc15;">${guestOptions}</select>`;
                            }
                        }
                        membersHtml += `</div>`;
                    }

                    if (!isLocked) {
                        membersHtml += `<button onclick="updateMembers('${ticketId}', ${memberCount}, ${isVip}, ${isParty})" style="background-color: #3b82f6; color: white;">บันทึกข้อมูล (บันทึกได้ครั้งเดียวเท่านั้น)</button>`;
                    }

                    const ticketDiv = document.createElement('div');
                    ticketDiv.className = 'ticket-box';
                    ticketDiv.innerHTML = `
                        <h3>ตั๋วประเภท: ${data.type.toUpperCase()}</h3>
                        <p>สถานะ: <span class="${statusClass}">${statusText}</span></p>
                        ${isPaid ? `
                            <p style="text-align:center; font-size: 14px; margin-top: 15px;">นำ QR Code นี้ให้สตาฟฟ์สแกนหน้างาน</p>
                            <div id="qrcode_${ticketId}" id="qrcode"></div>
                        ` : ''}
                        <hr style="border-color: #555; margin: 15px 0;">
                        ${membersHtml}
                    `;
                    
                    ticketContainer.appendChild(ticketDiv);

                    if(isPaid) {
                        new QRCode(document.getElementById(`qrcode_${ticketId}`), { text: ticketId, width: 150, height: 150 });
                    }
                });
            } catch (error) {
                console.error(error);
                ticketContainer.innerHTML = '<p style="color:red;">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>';
            }
        }

        window.updateMembers = async function(ticketId, count, isVip, isParty) {
            let membersArray = [];
            let selectedGuests = [];
            let hasDuplicateGuest = false;
            
            for(let i = 0; i < count; i++) {
                let guestVal = isVip ? document.getElementById(`m_guest_${ticketId}_${i}`).value : '';
                
                // ตรวจสอบเกสต์ซ้ำเฉพาะ VIP
                if (isVip && guestVal !== '') {
                    if (selectedGuests.includes(guestVal)) {
                        hasDuplicateGuest = true;
                    }
                    selectedGuests.push(guestVal);
                }

                membersArray.push({
                    name: document.getElementById(`m_name_${ticketId}_${i}`).value,
                    dob: document.getElementById(`m_dob_${ticketId}_${i}`).value,
                    facebook: document.getElementById(`m_fb_${ticketId}_${i}`).value,
                    guest: guestVal
                });
            }

            if (hasDuplicateGuest) {
                alert('ห้ามเลือก Guest ซ้ำกันในโต๊ะเดียวกันครับ กรุณาเลือกใหม่');
                return;
            }

            if(!confirm('คุณสามารถบันทึกข้อมูลได้เพียงครั้งเดียว หากต้องการแก้ไขภายหลังต้องติดต่อเพจเฟซบุ๊ก ต้องการบันทึกเลยหรือไม่?')) return;

            let requestVal = (isParty || isVip) ? document.getElementById(`request_${ticketId}`).value : '';

            try {
                const ticketRef = doc(db, "Tickets", ticketId);
                await updateDoc(ticketRef, { 
                    members: membersArray,
                    request: requestVal,
                    isMembersLocked: true 
                });
                alert('บันทึกข้อมูลสำเร็จ!');
                window.location.reload();
            } catch (error) {
                console.error(error);
                alert('เกิดข้อผิดพลาดในการอัปเดตข้อมูล');
            }
        };
    </script>
</body>
</html>
