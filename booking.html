<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองบัตร - CosNite Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff3ec9; --accent: #fff7ad; --bg: #fffafc; --text: #333; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(255,62,201,0.1); border: 2px solid #ffe6f7; }
        h2 { color: var(--primary); text-align: center; margin-top: 0; }
        label { font-weight: 500; color: #555; }
        select, input, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 25px; border-radius: 10px; border: 1px solid #ddd; font-family: 'Kanit', sans-serif; font-size: 1rem; outline: none; transition: 0.3s; }
        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(255,62,201,0.3); }
        button { background-color: var(--primary); color: white; font-weight: 500; cursor: pointer; border: none; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(255,62,201,0.3); }
        button:hover { background-color: #e62eb3; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h2>เลือกแพ็กเกจที่คุณต้องการ</h2>
        <form id="bookingForm">
            <label for="ticketType">ประเภทบัตร:</label>
            <select id="ticketType" required>
                <option value="">-- กรุณาเลือก --</option>
                <option value="solo">Solo (เดี่ยว) - 690 บาท</option>
                <option value="party4">Party โต๊ะ 4 คน - 3,400 บาท</option>
                <option value="party6">Party โต๊ะ 6 คน - 5,100 บาท</option>
                <option value="vip4">VIP โต๊ะ 4 คน - 6,000 บาท</option>
                <option value="vip6">VIP โต๊ะ 6 คน - 9,000 บาท</option>
            </select>

            <div id="drinkSelection" style="display: none;">
                <label for="drinkSet">เลือกเซ็ตเครื่องดื่ม:</label>
                <select id="drinkSet">
                    <option value="A">Set A - Sangsom + Mixer</option>
                    <option value="B">Set B - Leo Beer</option>
                    <option value="C">Set C - Soju (+39 บาท/คน)</option>
                </select>
            </div>

            <button type="submit">ไปหน้าชำระเงิน</button>
        </form>
    </div>

    <script>
        const ticketSelect = document.getElementById('ticketType');
        const drinkDiv = document.getElementById('drinkSelection');
        ticketSelect.addEventListener('change', function() {
            drinkDiv.style.display = this.value.includes('party') ? 'block' : 'none';
        });

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            localStorage.setItem('bookingData', JSON.stringify({
                ticketType: document.getElementById('ticketType').value,
                drinkSet: document.getElementById('drinkSet').value
            }));
            window.location.href = 'checkout.html';
        });
    </script>
</body>
</html>
