<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosNite Club Party</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff3ec9; --accent: #fff7ad; --bg: #fffafc; --text-dark: #333; --white: #ffffff; }
        body { font-family: 'Kanit', sans-serif; text-align: center; background-color: var(--bg); color: var(--text-dark); margin: 0; padding: 50px 20px; overflow-x: hidden; }
        
        /* พื้นหลังตกแต่ง */
        .bg-shape { position: absolute; border-radius: 50%; filter: blur(60px); z-index: -1; animation: float 6s infinite ease-in-out alternate; }
        .shape1 { top: -50px; left: -50px; width: 300px; height: 300px; background: rgba(255, 62, 201, 0.2); }
        .shape2 { bottom: 10%; right: -50px; width: 250px; height: 250px; background: rgba(255, 247, 173, 0.6); animation-delay: 2s; }
        
        @keyframes float { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(30px) scale(1.1); } }

        .container { max-width: 700px; margin: 0 auto; background: rgba(255, 255, 255, 0.9); padding: 50px 40px; border-radius: 30px; box-shadow: 0 15px 35px rgba(255, 62, 201, 0.1); border: 2px solid rgba(255, 62, 201, 0.2); backdrop-filter: blur(10px); position: relative; }
        h1 { color: var(--primary); font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 0px var(--accent); line-height: 1.2; animation: popIn 0.8s ease-out; }
        .subtitle { font-size: 1.2rem; color: #666; margin-bottom: 30px; animation: popIn 1s ease-out; }
        
        .info-box { background: var(--bg); padding: 20px; border-radius: 15px; border: 1px dashed var(--primary); margin: 20px 0; font-size: 1.1rem; animation: popIn 1.2s ease-out; }
        .highlight { color: var(--primary); font-weight: bold; background: var(--accent); padding: 2px 10px; border-radius: 8px; }
        
        .btn { display: inline-block; padding: 16px 50px; background: linear-gradient(135deg, #ff3ec9, #ff7beb); color: var(--white); text-decoration: none; font-size: 1.4rem; font-weight: bold; border-radius: 50px; margin-top: 20px; transition: 0.3s; box-shadow: 0 10px 20px rgba(255, 62, 201, 0.3); border: 2px solid transparent; animation: pulse 2s infinite; }
        .btn:hover { transform: translateY(-5px); box-shadow: 0 15px 25px rgba(255, 62, 201, 0.5); border: 2px solid var(--accent); }

        @keyframes popIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 62, 201, 0.5); } 70% { box-shadow: 0 0 0 15px rgba(255, 62, 201, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 62, 201, 0); } }
    </style>
</head>
<body>
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <div class="container">
        <h1>CosNite Club<br>🎉</h1>
        <p class="subtitle">ปาร์ตี้คอสเพลย์ที่สนุกที่สุดแห่งปี!</p>
        
        <div class="info-box">
            <p>📅 วันที่ <span class="highlight">13 กันยายน 2569</span></p>
            <p>⏰ เวลา 17:30 - 01:30 น.</p>
            <p>📍 ร้าน praao ratchayothin (ติด BTS รัชโยธิน ทางออก 4)</p>
        </div>

        <p style="color: #555; margin-bottom: 30px;">พบกับ Special Guests สุดพิเศษ และวง Cover Dance<br>พร้อมกิจกรรมเซอร์วิสมากมายภายในงาน!</p>
        
        <a href="booking.html" class="btn">จองบัตรเข้างาน</a>
    </div>
</body>
</html>
