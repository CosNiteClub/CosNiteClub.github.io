<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - CosNite Club</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #2a2a2a; padding: 30px; border-radius: 10px; }
        input, button { padding: 10px; margin-top: 10px; border-radius: 5px; border: none; }
        button { background-color: #facc15; color: black; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 12px; text-align: left; }
        th { background-color: #333; }
        .slip-img { max-width: 100px; cursor: pointer; border-radius: 5px; }
        .btn-approve { background-color: #4ade80; color: black; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบจัดการหลังบ้าน (Admin) - ตรวจสอบสลิป</h2>
        
        <div id="loginSection">
            <p>กรุณากรอกอีเมลแอดมินเพื่อเข้าสู่ระบบ</p>
            <input type="email" id="adminEmail" placeholder="อีเมลแอดมิน" style="width: 80%;">
            <button id="loginBtn">เข้าสู่ระบบ</button>
        </div>

        <div id="adminPanel" style="display: none;">
            <p style="color: #4ade80;">เข้าสู่ระบบสำเร็จ! (สิทธิ์แอดมิน)</p>
            <table>
                <thead>
                    <tr>
                        <th>ประเภทตั๋ว</th>
                        <th>ราคาที่จ่าย</th>
                        <th>ช่องทาง</th>
                        <th>สลิปโอนเงิน</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="ticketTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVvOAwIpu6PPcQumrmqN0Sdc9yT-69kRE",
            authDomain: "cosniteclub.firebaseapp.com",
            projectId: "cosniteclub",
            storageBucket: "cosniteclub.firebasestorage.app",
            messagingSenderId: "429033863377",
            appId: "1:429033863377:web:e1077d4f5ebf29e3e8adf0",
            measurementId: "G-8GSH09B7P2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('adminEmail').value;
            if (email === 'cosniteclubparty@gmail.com') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadPendingTickets();
            } else {
                alert('อีเมลไม่ถูกต้อง ไม่มีสิทธิ์เข้าถึงครับ');
            }
        });

        async function loadPendingTickets() {
            const tableBody = document.getElementById('ticketTableBody');
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>';
            
            try {
                const q = query(collection(db, "Tickets"), where("status", "==", "pending_verification"));
                const querySnapshot = await getDocs(q);
                
                tableBody.innerHTML = ''; 
                
                if (querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">ไม่มีรายการรอตรวจสอบครับ</td></tr>';
                    return;
                }

                querySnapshot.forEach((documentSnapshot) => {
                    const data = documentSnapshot.data();
                    const ticketId = documentSnapshot.id;
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${data.type.toUpperCase()} ${data.drinkSet ? '(Set ' + data.drinkSet + ')' : ''}</td>
                        <td>${data.pricePaid.toLocaleString()} บาท</td>
                        <td>${data.paymentMethod}</td>
                        <td><a href="${data.slipUrl}" target="_blank"><img src="${data.slipUrl}" class="slip-img" alt="สลิป"></a></td>
                        <td>
                            <button class="btn-approve" onclick="approveTicket('${ticketId}')">ยืนยันยอดเงิน</button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error loading tickets: ", error);
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
            }
        }

        window.approveTicket = async function(ticketId) {
            if (confirm('คุณตรวจสอบสลิปและต้องการยืนยันยอดเงินนี้ใช่หรือไม่?')) {
                try {
                    const ticketRef = doc(db, "Tickets", ticketId);
                    await updateDoc(ticketRef, {
                        status: "paid"
                    });
                    alert('อัปเดตสถานะเป็น Paid สำเร็จ!');
                    loadPendingTickets(); 
                } catch (error) {
                    console.error("Error updating document: ", error);
                    alert('เกิดข้อผิดพลาดในการอัปเดตสถานะ');
                }
            }
        };
    </script>
</body>
</html>
