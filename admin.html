<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CosNite Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff3ec9; --accent: #fff7ad; --bg: #f9f9f9; --text: #333; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: var(--primary); margin-top:0; }
        input, button, select, textarea { padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: inherit; font-size: 14px; outline:none;}
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; transition: 0.2s; }
        button:hover { filter: brightness(1.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; vertical-align: top; }
        th { background-color: var(--accent); color: #555; }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .tab-btn { background-color: transparent; color: #777; padding: 10px 20px; border-radius: 30px; font-weight: 500; border: 1px solid #ddd; }
        .tab-btn.active { background-color: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(255,62,201,0.3); }
        .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .dash-card { background: #fff; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #ffe6f7; box-shadow: 0 4px 10px rgba(255,62,201,0.05); }
        .dash-card h3 { margin: 0; color: #666; font-size: 14px; }
        .dash-card p { margin: 5px 0 0 0; font-size: 24px; font-weight: bold; color: var(--primary); }
        
        .guest-manage-box { background: #fffafc; border: 1px dashed var(--primary); padding: 20px; border-radius: 12px; margin-bottom:20px;}
        .guest-item { display: inline-flex; align-items: center; background: white; padding: 5px 15px; border-radius: 20px; border: 1px solid var(--primary); margin: 5px; color: var(--primary); }
        .guest-item span { cursor: pointer; color: #ef4444; margin-left: 10px; font-weight: bold; }
        
        /* Modal แก้ไขลูกค้า */
        #editModalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; backdrop-filter: blur(2px);}
        #editModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; border-radius: 20px; z-index: 101; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบจัดการหลังบ้าน (Admin)</h2>
        
        <div id="loginSection" style="text-align:center; padding: 50px 0;">
            <input type="email" id="adminEmail" placeholder="อีเมลแอดมิน" style="width: 300px;">
            <button id="loginBtn" style="padding: 10px 20px;">เข้าสู่ระบบ</button>
        </div>

        <div id="adminPanel" style="display: none;">
            <div class="tab-menu">
                <button class="tab-btn active" onclick="switchTab('tab-pending')">ตรวจสอบสลิป</button>
                <button class="tab-btn" onclick="switchTab('tab-manage')">สรุปยอด & จัดการตั๋ว</button>
                <button class="tab-btn" onclick="switchTab('tab-settings')">ตั้งค่ารายชื่อเกสต์</button>
            </div>

            <div id="tab-pending">
                <table id="pendingTable">
                    <thead><tr><th>ประเภทตั๋ว</th><th>ราคา</th><th>ช่องทาง</th><th>สลิป</th><th style="width:100px;">จัดการ</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="tab-manage" style="display: none;">
                <div class="dash-grid">
                    <div class="dash-card"><h3>รวม (500)</h3><p id="dashTotal">0/500</p></div>
                    <div class="dash-card"><h3>VIP (78)</h3><p id="dashVip">0/78</p></div>
                    <div class="dash-card"><h3>Party (372)</h3><p id="dashParty">0/372</p></div>
                    <div class="dash-card"><h3>Solo (50)</h3><p id="dashSolo">0/50</p></div>
                </div>
                
                <table id="paidTable">
                    <thead><tr><th>ID</th><th>ประเภท</th><th>ข้อมูลผู้ร่วมงาน</th><th style="width:100px;">จัดการ</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="tab-settings" style="display: none;">
                <div class="guest-manage-box">
                    <h3 style="margin-top:0; color:var(--primary);">รายชื่อ Guest สำหรับ VIP</h3>
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <input type="text" id="newGuestName" placeholder="เพิ่มชื่อเกสต์ใหม่..." style="flex:1;">
                        <button onclick="addGuest()">เพิ่มเกสต์</button>
                    </div>
                    <div id="guestListContainer">กำลังโหลด...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="editModalOverlay" onclick="closeModal()"></div>
    <div id="editModal">
        <h3 style="color:var(--primary); margin-top:0;">แก้ไขข้อมูลลูกค้า (Admin)</h3>
        <input type="hidden" id="editTid"><input type="hidden" id="editType">
        <textarea id="editReq" rows="2" style="width:100%; margin-bottom:15px;" placeholder="รีเควสโซน/อื่นๆ"></textarea>
        <div id="editMembersArea"></div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button onclick="saveAdminEdit()" style="flex:1; background:#10b981;">บันทึก</button>
            <button onclick="closeModal()" style="flex:1; background:#ef4444;">ยกเลิก</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBVvOAwIpu6PPcQumrmqN0Sdc9yT-69kRE",
            authDomain: "cosniteclub.firebaseapp.com",
            projectId: "cosniteclub"
        });
        const db = getFirestore(app);
        
        let globalGuests = [];

        window.switchTab = function(id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-pending').style.display = 'none';
            document.getElementById('tab-manage').style.display = 'none';
            document.getElementById('tab-settings').style.display = 'none';
            event.target.classList.add('active');
            document.getElementById(id).style.display = 'block';
            
            if(id === 'tab-pending') loadPending();
            if(id === 'tab-manage') loadPaid();
            if(id === 'tab-settings') loadGuests();
        }

        document.getElementById('loginBtn').addEventListener('click', () => {
            if(document.getElementById('adminEmail').value === 'cosniteclubparty@gmail.com') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadPending(); loadGuests();
            } else alert('อีเมลผิด');
        });

        // --- ระบบ Guest ---
        async function loadGuests() {
            try {
                const docRef = doc(db, "Settings", "GuestList");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().guests) {
                    globalGuests = docSnap.data().guests;
                } else {
                    await setDoc(docRef, { guests: ["เกสต์ A", "เกสต์ B"] });
                    globalGuests = ["เกสต์ A", "เกสต์ B"];
                }
                renderGuests();
            } catch(e) { console.error(e); }
        }
        function renderGuests() {
            const div = document.getElementById('guestListContainer');
            div.innerHTML = '';
            globalGuests.forEach((g, idx) => {
                div.innerHTML += `<div class="guest-item">${g} <span onclick="removeGuest(${idx})">×</span></div>`;
            });
        }
        window.addGuest = async function() {
            const val = document.getElementById('newGuestName').value.trim();
            if(!val) return;
            globalGuests.push(val);
            await updateDoc(doc(db, "Settings", "GuestList"), { guests: globalGuests });
            document.getElementById('newGuestName').value = '';
            renderGuests();
        }
        window.removeGuest = async function(idx) {
            if(!confirm('ลบเกสต์ท่านนี้?')) return;
            globalGuests.splice(idx, 1);
            await updateDoc(doc(db, "Settings", "GuestList"), { guests: globalGuests });
            renderGuests();
        }

        // --- โหลดตั๋ว ---
        async function loadPending() {
            const tbody = document.querySelector('#pendingTable tbody');
            tbody.innerHTML = '<tr><td colspan="5">โหลด...</td></tr>';
            const qs = await getDocs(query(collection(db, "Tickets"), where("status", "==", "pending_verification")));
            tbody.innerHTML = '';
            qs.forEach(d => {
                const data = d.data();
                tbody.innerHTML += `<tr>
                    <td>${data.type}</td><td>${data.pricePaid}</td><td>${data.paymentMethod}</td>
                    <td><a href="${data.slipUrl}" target="_blank"><img src="${data.slipUrl}" style="max-width:80px; border-radius:5px;"></a></td>
                    <td><button onclick="approve('${d.id}')" style="background:#10b981; width:100%; margin-bottom:5px;">ยืนยัน</button>
                        <button onclick="delTicket('${d.id}')" style="background:#ef4444; width:100%;">ลบ</button></td>
                </tr>`;
            });
        }

        async function loadPaid() {
            const tbody = document.querySelector('#paidTable tbody');
            tbody.innerHTML = '<tr><td colspan="4">โหลด...</td></tr>';
            const qs = await getDocs(query(collection(db, "Tickets"), where("status", "==", "paid")));
            tbody.innerHTML = '';
            let cTotal=0, cVip=0, cParty=0, cSolo=0;

            qs.forEach(d => {
                const data = d.data();
                let s = 1; if(data.type.includes('4')) s=4; if(data.type.includes('6')) s=6;
                cTotal += s; if(data.type.includes('vip')) cVip+=s; if(data.type.includes('party')) cParty+=s; if(data.type.includes('solo')) cSolo+=s;
                
                let mHtml = data.request ? `<div style="color:var(--primary); font-size:12px;">Req: ${data.request}</div>` : '';
                if(data.members) {
                    data.members.forEach((m,i) => mHtml += `<div style="font-size:12px;">${i+1}.${m.name||'-'}|${m.dob||'-'}|${m.facebook||'-'} ${data.type.includes('vip')?`<b>[${m.guest||''}]</b>`:''}</div>`);
                }
                
                tbody.innerHTML += `<tr>
                    <td style="font-size:11px; color:#aaa;">${d.id}</td><td>${data.type}</td><td>${mHtml}</td>
                    <td><button onclick="openEdit('${d.id}')" style="width:100%; margin-bottom:5px;">แก้ไข</button></td>
                </tr>`;
            });
            document.getElementById('dashTotal').innerText = `${cTotal}/500`;
            document.getElementById('dashVip').innerText = `${cVip}/78`;
            document.getElementById('dashParty').innerText = `${cParty}/372`;
            document.getElementById('dashSolo').innerText = `${cSolo}/50`;
        }

        window.approve = async (id) => { if(confirm('ยืนยัน?')) { await updateDoc(doc(db,"Tickets",id),{status:"paid"}); loadPending(); } }
        window.delTicket = async (id) => { if(confirm('ลบทิ้ง?')) { await deleteDoc(doc(db,"Tickets",id)); loadPending(); loadPaid(); } }

        // --- แก้ไขโดยแอดมิน ---
        window.openEdit = async function(id) {
            const dSnap = await getDoc(doc(db, "Tickets", id));
            const data = dSnap.data();
            document.getElementById('editTid').value = id;
            document.getElementById('editType').value = data.type;
            document.getElementById('editReq').value = data.request || '';
            
            let s=1; if(data.type.includes('4')) s=4; if(data.type.includes('6')) s=6;
            let isVip = data.type.includes('vip');
            let h = '';
            
            for(let i=0; i<s; i++) {
                let m = data.members && data.members[i] ? data.members[i] : {name:'',dob:'',facebook:'',guest:''};
                h += `<div style="background:#f9f9f9; padding:10px; margin-bottom:10px; border-radius:8px;">
                    <b style="color:var(--primary);">คนที่ ${i+1}</b>
                    <input type="text" id="ed_n_${i}" value="${m.name}" placeholder="ชื่อ">
                    <input type="text" id="ed_d_${i}" value="${m.dob}" placeholder="เกิด">
                    <input type="text" id="ed_f_${i}" value="${m.facebook}" placeholder="FB">`;
                if(isVip) {
                    let opts = `<option value="">- เลือกเกสต์ -</option>`;
                    globalGuests.forEach(g => opts += `<option value="${g}" ${m.guest===g?'selected':''}>${g}</option>`);
                    h += `<select id="ed_g_${i}">${opts}</select>`;
                }
                h += `</div>`;
            }
            document.getElementById('editMembersArea').innerHTML = h;
            document.getElementById('editModalOverlay').style.display = 'block';
            document.getElementById('editModal').style.display = 'block';
        }

        window.closeModal = () => { document.getElementById('editModalOverlay').style.display='none'; document.getElementById('editModal').style.display='none'; }
        
        window.saveAdminEdit = async function() {
            const id = document.getElementById('editTid').value;
            const type = document.getElementById('editType').value;
            let s=1; if(type.includes('4')) s=4; if(type.includes('6')) s=6;
            let isVip = type.includes('vip');
            let arr = [];
            for(let i=0; i<s; i++) {
                arr.push({
                    name: document.getElementById(`ed_n_${i}`).value,
                    dob: document.getElementById(`ed_d_${i}`).value,
                    facebook: document.getElementById(`ed_f_${i}`).value,
                    guest: isVip ? document.getElementById(`ed_g_${i}`).value : ''
                });
            }
            await updateDoc(doc(db,"Tickets",id), { request: document.getElementById('editReq').value, members: arr, isMembersLocked: true });
            closeModal(); loadPaid();
        }
    </script>
</body>
</html>
