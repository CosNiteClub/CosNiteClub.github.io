<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CosNite Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ... สไตล์อื่นๆ เหมือนเดิม เพิ่มเติมเฉพาะส่วนจัดการปุ่ม ... */
        :root { --primary: #ff3ec9; --accent: #fff7ad; --bg: #f9f9f9; --text: #333; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: var(--primary); margin-top:0; }
        input, button, select, textarea { padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: inherit; font-size: 14px; outline:none;}
        button { cursor: pointer; transition: 0.2s; border: none; color: white; font-weight: 500;}
        button:hover { filter: brightness(1.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; vertical-align: top; }
        th { background-color: var(--accent); color: #555; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .tab-btn { background-color: transparent; color: #777; padding: 10px 20px; border-radius: 30px; border: 1px solid #ddd; }
        .tab-btn.active { background-color: var(--primary); color: white; border-color: var(--primary); }
        
        .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .dash-card { background: #fff; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #ffe6f7; }
        .dash-card h3 { margin: 0; color: #666; font-size: 14px; }
        .dash-card p { margin: 5px 0 0 0; font-size: 24px; font-weight: bold; color: var(--primary); }
        
        /* สไตล์ปุ่มตารางที่จัดระเบียบใหม่ */
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .action-btns button { padding: 8px; font-size: 12px; border-radius: 6px; }
        .btn-edit { background-color: #3b82f6; } /* สีฟ้า */
        .btn-transfer { background-color: #f59e0b; } /* สีส้ม */
        .btn-del { background-color: #ef4444; grid-column: span 2; } /* สีแดง ยาวเต็ม */
        .btn-approve { background-color: #10b981; grid-column: span 2; } /* สีเขียว */

        #editModalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; backdrop-filter: blur(2px);}
        #editModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; border-radius: 20px; z-index: 101; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .admin-note-box { background: #fff0f9; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบจัดการหลังบ้าน (Admin)</h2>
        <div id="loginSection" style="text-align:center; padding: 50px 0;">
            <input type="email" id="adminEmail" placeholder="อีเมลแอดมิน" style="width: 300px;">
            <button id="loginBtn" style="padding: 10px 20px; background:var(--primary);">เข้าสู่ระบบ</button>
        </div>

        <div id="adminPanel" style="display: none;">
            <div class="tab-menu">
                <button class="tab-btn active" onclick="switchTab('tab-pending')">ตรวจสอบสลิป</button>
                <button class="tab-btn" onclick="switchTab('tab-manage')">สรุปยอด & จัดการตั๋ว</button>
            </div>

            <div id="tab-pending">
                <table id="pendingTable">
                    <thead><tr><th>ประเภทตั๋ว</th><th>ราคา</th><th>สลิป</th><th style="width:120px;">จัดการ</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="tab-manage" style="display: none;">
                <div class="dash-grid">
                    <div class="dash-card"><h3>รวม (500)</h3><p id="dashTotal">0/500</p></div>
                    <div class="dash-card"><h3>VIP (78)</h3><p id="dashVip">0/78</p></div>
                    <div class="dash-card"><h3>Party (372)</h3><p id="dashParty">0/372</p></div>
                    <div class="dash-card"><h3>Solo (50)</h3><p id="dashSolo">0/50</p></div>
                </div>
                
                <table id="paidTable">
                    <thead><tr><th>อ้างอิง/โต๊ะ</th><th>ประเภท</th><th>รายละเอียดลูกค้า</th><th style="width:150px;">จัดการ (Admin)</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="editModalOverlay" onclick="closeModal()"></div>
    <div id="editModal">
        <h3 style="color:var(--primary); margin-top:0;">แก้ไขข้อมูลตั๋ว</h3>
        <input type="hidden" id="editTid"><input type="hidden" id="editType">
        
        <div class="admin-note-box">
            <label style="font-weight:bold; color:var(--primary); font-size:13px;">สำหรับแอดมินจัดผังโต๊ะ:</label>
            <input type="text" id="editTableNum" placeholder="ระบุหมายเลข / ชื่อโต๊ะ (เช่น V01, P12)" style="width:100%; margin-bottom:10px;">
            <textarea id="editNote" rows="2" placeholder="Note ภายในแอดมิน (ลูกค้าไม่เห็น)" style="width:100%;"></textarea>
        </div>

        <textarea id="editReq" rows="2" style="width:100%; margin-bottom:15px;" placeholder="รีเควสโซน/อื่นๆ"></textarea>
        <div id="editMembersArea"></div>
        
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button onclick="saveAdminEdit()" style="flex:1; background:#10b981;">บันทึกการแก้ไข</button>
            <button onclick="closeModal()" style="flex:1; background:#ef4444;">ยกเลิก</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBVvOAwIpu6PPcQumrmqN0Sdc9yT-69kRE",
            authDomain: "cosniteclub.firebaseapp.com",
            projectId: "cosniteclub"
        });
        const db = getFirestore(app);

        // ... (ระบบ Login & Tabs เหมือนเดิม) ...
        window.switchTab = function(id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-pending').style.display = 'none';
            document.getElementById('tab-manage').style.display = 'none';
            event.target.classList.add('active');
            document.getElementById(id).style.display = 'block';
            if(id === 'tab-pending') loadPending();
            if(id === 'tab-manage') loadPaid();
        }

        document.getElementById('loginBtn').addEventListener('click', () => {
            if(document.getElementById('adminEmail').value === 'cosniteclubparty@gmail.com') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadPending(); 
            } else alert('อีเมลผิด');
        });

        // 1. โหลดตั๋วรอตรวจ
        async function loadPending() {
            const tbody = document.querySelector('#pendingTable tbody');
            tbody.innerHTML = '<tr><td colspan="4">โหลด...</td></tr>';
            const qs = await getDocs(query(collection(db, "Tickets"), where("status", "==", "pending_verification")));
            tbody.innerHTML = '';
            qs.forEach(d => {
                const data = d.data();
                tbody.innerHTML += `<tr>
                    <td>${data.type}</td>
                    <td>${data.pricePaid} ฿<br><span style="font-size:10px; color:#aaa;">(${data.paymentMethod})</span></td>
                    <td><a href="${data.slipUrl}" target="_blank"><img src="${data.slipUrl}" style="max-width:80px; border-radius:5px;"></a></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-approve" onclick="approve('${d.id}')">ยืนยันสลิป</button>
                            <button class="btn-del" onclick="delTicket('${d.id}')">ลบทิ้ง</button>
                        </div>
                    </td>
                </tr>`;
            });
        }

        // 2. โหลดตั๋วที่ขายแล้ว (จัดหน้าปุ่มใหม่)
        async function loadPaid() {
            const tbody = document.querySelector('#paidTable tbody');
            tbody.innerHTML = '<tr><td colspan="4">โหลด...</td></tr>';
            const qs = await getDocs(query(collection(db, "Tickets"), where("status", "==", "paid")));
            tbody.innerHTML = '';
            let cTotal=0, cVip=0, cParty=0, cSolo=0;

            qs.forEach(d => {
                const data = d.data();
                let s = 1; if(data.type.includes('4')) s=4; if(data.type.includes('6')) s=6;
                cTotal += s; if(data.type.includes('vip')) cVip+=s; if(data.type.includes('party')) cParty+=s; if(data.type.includes('solo')) cSolo+=s;
                
                let tableTag = data.tableNumber ? `<div style="color:var(--primary); font-weight:bold; font-size:14px;">📍 โต๊ะ: ${data.tableNumber}</div>` : '';
                let mHtml = data.request ? `<div style="color:#f59e0b; font-size:12px;">Req: ${data.request}</div>` : '';
                if(data.members) {
                    data.members.forEach((m,i) => mHtml += `<div style="font-size:12px; margin-top:3px;">${i+1}.${m.name||'-'} | ${data.type.includes('vip')?`<b style="color:var(--primary);">[${m.guest||'ไม่ระบุ'}]</b>`:''}</div>`);
                }
                
                tbody.innerHTML += `<tr>
                    <td>
                        ${tableTag}
                        <span style="font-size:10px; color:#aaa;">ID: ${d.id}</span>
                    </td>
                    <td>${data.type.toUpperCase()}</td>
                    <td>${mHtml}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="openEdit('${d.id}')">แก้ไข</button>
                            <button class="btn-transfer" onclick="transferTicket('${d.id}')">โอนสิทธิ์</button>
                            <button class="btn-del" onclick="delTicket('${d.id}')">ลบออก</button>
                        </div>
                    </td>
                </tr>`;
            });
            // อัปเดตตัวเลข
            document.getElementById('dashTotal').innerText = `${cTotal}/500`;
            document.getElementById('dashVip').innerText = `${cVip}/78`;
            document.getElementById('dashParty').innerText = `${cParty}/372`;
            document.getElementById('dashSolo').innerText = `${cSolo}/50`;
        }

        // ฟังก์ชัน Action ของแอดมิน
        window.approve = async (id) => { if(confirm('ยืนยันสลิปยอดเงิน?')) { await updateDoc(doc(db,"Tickets",id),{status:"paid"}); loadPending(); } }
        window.delTicket = async (id) => { if(confirm('ลบตั๋วใบนี้ทิ้งอย่างถาวร?')) { await deleteDoc(doc(db,"Tickets",id)); loadPending(); loadPaid(); } }
        
        // ฟังก์ชันโอนสิทธิ์ตั๋ว (Transfer)
        window.transferTicket = async function(id) {
            const newUid = prompt("กรุณากรอก UID ของลูกค้าใหม่ที่ต้องการรับโอนตั๋วนี้\\n(ลูกค้าสามารถดู UID ของตัวเองได้ที่หน้าเว็บ 'ตั๋วของฉัน'):");
            if(!newUid || newUid.trim() === '') return;
            
            if(confirm(`ยืนยันการโอนสิทธิ์ตั๋วไปยัง UID: ${newUid.trim()} ใช่หรือไม่?`)) {
                try {
                    await updateDoc(doc(db, "Tickets", id), { userId: newUid.trim() });
                    alert("✅ โอนสิทธิ์สำเร็จ! ตั๋วจะย้ายไปที่บัญชีของลูกค้าใหม่ทันที");
                    loadPaid();
                } catch(e) {
                    console.error(e); alert("เกิดข้อผิดพลาดในการโอน");
                }
            }
        };

        // --- แก้ไขข้อมูล & จัดการผังโต๊ะ ---
        window.openEdit = async function(id) {
            const dSnap = await getDoc(doc(db, "Tickets", id));
            const data = dSnap.data();
            document.getElementById('editTid').value = id;
            document.getElementById('editType').value = data.type;
            
            // ดึงข้อมูลโต๊ะ/Note
            document.getElementById('editTableNum').value = data.tableNumber || '';
            document.getElementById('editNote').value = data.adminNote || '';
            document.getElementById('editReq').value = data.request || '';
            
            let s=1; if(data.type.includes('4')) s=4; if(data.type.includes('6')) s=6;
            let isVip = data.type.includes('vip');
            let h = '';
            
            for(let i=0; i<s; i++) {
                let m = data.members && data.members[i] ? data.members[i] : {name:'',dob:'',facebook:'',guest:''};
                h += `<div style="background:#f9f9f9; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #eee;">
                    <b style="color:var(--primary); font-size:13px;">คนที่ ${i+1}</b>
                    <input type="text" id="ed_n_${i}" value="${m.name}" placeholder="ชื่อ-สกุล" style="width:100%; margin:3px 0;">
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="ed_d_${i}" value="${m.dob}" placeholder="วันเกิด" style="flex:1;">
                        <input type="text" id="ed_f_${i}" value="${m.facebook}" placeholder="Facebook" style="flex:1;">
                    </div>`;
                if(isVip) {
                    h += `<input type="text" id="ed_g_${i}" value="${m.guest}" placeholder="ชื่อเกสต์ 2-Shot" style="width:100%; border:1px dashed var(--primary); margin-top:5px;">`;
                }
                h += `</div>`;
            }
            document.getElementById('editMembersArea').innerHTML = h;
            document.getElementById('editModalOverlay').style.display = 'block';
            document.getElementById('editModal').style.display = 'block';
        }

        window.closeModal = () => { document.getElementById('editModalOverlay').style.display='none'; document.getElementById('editModal').style.display='none'; }
        
        window.saveAdminEdit = async function() {
            const id = document.getElementById('editTid').value;
            const type = document.getElementById('editType').value;
            let s=1; if(type.includes('4')) s=4; if(type.includes('6')) s=6;
            let isVip = type.includes('vip');
            let arr = [];
            for(let i=0; i<s; i++) {
                arr.push({ name: document.getElementById(`ed_n_${i}`).value, dob: document.getElementById(`ed_d_${i}`).value,
                           facebook: document.getElementById(`ed_f_${i}`).value, guest: isVip ? document.getElementById(`ed_g_${i}`).value : '' });
            }
            await updateDoc(doc(db,"Tickets",id), { 
                tableNumber: document.getElementById('editTableNum').value, adminNote: document.getElementById('editNote').value,
                request: document.getElementById('editReq').value, members: arr, isMembersLocked: true 
            });
            closeModal(); loadPaid();
        }
    </script>
</body>
</html>
